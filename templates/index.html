
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🥭MANGO 🇧🇩 TOOLS🥭</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8ecf5;font-family:Arial,sans-serif;padding:20px}
main{max-width:950px;margin:auto}
h1{color:#7dd3fc}
.card{background:#151d31;border:1px solid #2b3852;border-radius:12px;padding:18px;margin:16px 0}
input,select,button{padding:11px;border-radius:7px;border:1px solid #40506b;margin:4px;background:#0b1224;color:#fff}
input{max-width:100%}
button{cursor:pointer;background:#176bba;border:0}
button.danger{background:#b42335}
button.secondary{background:#475569}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px;border-bottom:1px solid #344158;text-align:left;overflow-wrap:anywhere}
.status{font-weight:bold}
#message{white-space:pre-wrap;color:#7dd3fc}
.table-wrap{overflow-x:auto}
.hidden{display:none}
.small{color:#aab6ca;font-size:13px}
</style>
</head>
<body>
<main>
<h1>🥭MANGO 🇧🇩 TOOLS🥭</h1>
<p class="small">License Key Management Panel</p>
<p id="message"></p>

<section class="card" id="loginBox">
<h3>Admin Login</h3>
<input id="password" type="password" placeholder="Admin password">
<button onclick="login()">Login</button>
</section>

<div id="panel" class="hidden">
<section class="card">
<h3>Create New Key</h3>
<label>Duration:</label>
<select id="days">
<option value="1">1 Day</option>
<option value="7">7 Days</option>
<option value="30">30 Days</option>
</select>
<button onclick="createKey()">Create Key</button>
<div id="newKey"></div>
</section>

<section class="card">
<h3>Key List</h3>
<button onclick="loadKeys()">🔄 Refresh List</button>
<button class="secondary" onclick="cleanup()">🧹 Delete Expired Keys</button>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Key</th>
<th>Status</th>
<th>Duration</th>
<th>Expires</th>
<th>Device Lock</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="keyRows">
<tr><td colspan="6">Loading...</td></tr>
</tbody>
</table>
</div>
</section>
<button class="secondary" onclick="logout()">Logout</button>
</div>
</main>

<script>
let adminPassword = "";

function message(text) {
  document.getElementById("message").textContent = text;
}

async function api(path, method = "GET", body = null) {
  const options = {
    method,
    headers: {"X-Admin-Password": adminPassword}
  };

  if (body !== null) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }

  const response = await fetch(path, options);
  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Request failed");
  }
  return data;
}

async function login() {
  adminPassword = document.getElementById("password").value;

  if (!adminPassword) {
    message("Admin password dao.");
    return;
  }

  try {
    await loadKeys();
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    document.getElementById("password").value = "";
    message("Login successful.");
  } catch (error) {
    adminPassword = "";
    message("Login failed: " + error.message);
  }
}

function logout() {
  adminPassword = "";
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("keyRows").innerHTML = "";
  message("Logged out.");
}

async function createKey() {
  try {
    const data = await api("/admin/keys", "POST", {
      days: Number(document.getElementById("days").value)
    });

    document.getElementById("newKey").textContent =
      "New key: " + data.key + " | Expires: " + data.expires_at;

    message("Key created successfully.");
    await loadKeys();
  } catch (error) {
    message("Create failed: " + error.message);
  }
}

async function loadKeys() {
  try {
    const data = await api("/admin/keys");
    if (!Array.isArray(data)) {
      throw new Error("Key list API format incorrect. Check app.py.");
    }

    const rows = document.getElementById("keyRows");
    rows.replaceChildren();

    if (data.length === 0) {
      rows.innerHTML = '<tr><td colspan="6">No keys found.</td></tr>';
      return;
    }

    for (const item of data) {
      const tr = document.createElement("tr");

      function cell(value) {
        const td = document.createElement("td");
        td.textContent = value ?? "-";
        tr.appendChild(td);
      }

      cell(item.key);
      cell(item.status);
      cell(item.days ? item.days + " day(s)" : "-");
      cell(item.expires_at || "-");
      cell(item.device_locked ? "Locked" : "No");

      const actions = document.createElement("td");

      const revokeBtn = document.createElement("button");
      revokeBtn.className = "secondary";
      revokeBtn.textContent = "Revoke";
      revokeBtn.onclick = () => revokeKey(item.key);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "danger";
      deleteBtn.textContent = "Delete";
      deleteBtn.onclick = () => deleteKey(item.key);

      actions.append(revokeBtn, deleteBtn);
      tr.appendChild(actions);
      rows.appendChild(tr);
    }

    message("Key list updated. Total keys: " + data.length);
  } catch (error) {
    message("List error: " + error.message);
    throw error;
  }
}

async function revokeKey(key) {
  if (!confirm("Revoke this key?\n" + key)) return;

  try {
    await api("/admin/revoke", "POST", {key});
    message("Key revoked.");
    await loadKeys();
  } catch (error) {
    message("Revoke failed: " + error.message);
  }
}

async function deleteKey(key) {
  if (!confirm("Permanently delete this key?\n" + key)) return;

  try {
    await api("/admin/delete", "POST", {key});
    message("Key permanently deleted.");
    await loadKeys();
  } catch (error) {
    message("Delete failed: " + error.message);
  }
}

async function cleanup() {
  if (!confirm("Permanently delete all expired keys?")) return;

  try {
    const data = await api("/admin/cleanup", "POST", {});
    message("Expired keys deleted: " + data.deleted_count);
    await loadKeys();
  } catch (error) {
    message("Cleanup failed: " + error.message);
  }
}
</script>
</body>
</html>
